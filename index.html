<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkyKiss Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🌤️ SkyKiss Weather App</h1>

  <!-- Search -->
  <input type="text" id="searchInput" placeholder="Search city...">

  <!-- Buttons -->
  <div class="buttons">
    <button onclick="sortTemp()">Sort by Temp</button>
    <button onclick="filterHot()">Hot Cities</button>
    <button onclick="toggleMode()">🌙 Toggle Mode</button>
  </div>

  <!-- Loader -->
  <p id="loading">Loading...</p>

  <!-- Weather Cards -->
  <div id="weatherContainer"></div>

  <script src="script.js"></script>
</body>
</html>
